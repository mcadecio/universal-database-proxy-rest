name: Publish Docker image

on:
  push:
    branches: [ "master" ]
    tags: [ "[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # clean is required: the Dockerfile copies a single *-fat.jar and the build fails
      # outright if a stale jar from another version is left in target/.
      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Resolve image tags
        id: tags
        run: |
          image=mcadecio/universal-database-proxy-rest
          tags="$image:$(git rev-parse --short HEAD)"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="$tags,$image:${GITHUB_REF_NAME#v}"
          fi

          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
